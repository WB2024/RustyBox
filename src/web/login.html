<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RustyBox — log in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8743b'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23e8743b'/%3E%3C/svg%3E">
<style>
:root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3b; --text:#e6e8ee; --muted:#8b93a5; --accent:#e8743b; --accent2:#ff9b63; --err:#ef5b5b; }
@media (prefers-color-scheme: light) { :root { --bg:#f4f5f8; --panel:#fff; --line:#dcdfe7; --text:#1b1e27; --muted:#667085; --accent:#d9581e; --accent2:#b8460f; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
form { width: min(360px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px 26px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; margin-bottom: 4px; }
.brand svg { width: 30px; height: 30px; }
p { color: var(--muted); margin: 0 0 18px; }
label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
input { display: block; width: 100%; margin-top: 4px; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); }
button { width: 100%; margin-top: 4px; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
button:hover:not(:disabled) { background: var(--accent2); }
button:disabled { opacity: .6; cursor: wait; }
#err { color: var(--err); min-height: 20px; margin: 10px 0 0; font-size: 13px; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="brand"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#e8743b"/><circle cx="16" cy="16" r="10" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1"/><circle cx="16" cy="16" r="5" fill="#111"/><circle cx="16" cy="16" r="2" fill="#e8743b"/></svg>RustyBox</div>
  <p>Log in to continue.</p>
  <label>User name<input name="username" id="u" autocomplete="username" autofocus required></label>
  <label>Password<input name="password" id="p" type="password" autocomplete="current-password" required></label>
  <button id="go">Log in</button>
  <div id="err" role="alert"></div>
</form>
<script>
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ username: document.getElementById("u").value, password: document.getElementById("p").value }) });
    if (r.ok) { location.reload(); return; }
    const d = await r.json().catch(() => ({}));
    err.textContent = d.message || "Could not log in";
  } catch { err.textContent = "Can't reach the server"; }
  go.disabled = false;
});
</script>
</body>
</html>
